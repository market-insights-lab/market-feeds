name: Daily harvest
on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC
  workflow_dispatch: {}      # "Run workflow" button for a manual run
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python harvest.py
        env:
          WATCHLIST: ${{ secrets.WATCHLIST }}
          COMPETITORS: ${{ secrets.COMPETITORS }}
      - name: Commit updated feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feeds data
          git diff --cached --quiet || git commit -m "Daily harvest $(date -u +%F)"
          git push
